spring.application.name=pokedex-api

# Lê variáveis de um arquivo backend/.env (opcional, ignorado pelo Git).
# Funciona rodando a partir da pasta backend (mvnw) ou da raiz do repositório (IDE).
# Variáveis de ambiente do sistema também funcionam e têm prioridade.
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

# ===== MongoDB =====
# Nunca coloque a connection string real aqui: use a variável MONGODB_URI.
# Sem a variável, usa um MongoDB local (mongodb://localhost:27017).
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
spring.mongodb.database=${MONGODB_DATABASE:pokedex}

# ===== Servidor =====
server.port=${PORT:8080}

# ===== Aplicação =====
# Origens autorizadas a chamar a API (frontend Vite). Separe várias por vírgula.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Popula o MongoDB a partir do Script_Pokedex.sql quando as coleções estão vazias.
app.seed.enabled=${SEED_ENABLED:true}
# true = apaga as coleções e recarrega o script a cada inicialização.
app.seed.reset=${SEED_RESET:false}
app.seed.script=classpath:data/Script_Pokedex.sql
